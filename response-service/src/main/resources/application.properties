# App
spring.application.name = response-service
server.port = 8084

# Database
spring.datasource.url = jdbc:postgresql://localhost:5432/mailflow_ai
spring.datasource.username = postgres
spring.datasource.password = @RDrules94
spring.datasource.driver-class-name = org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.open-in-view = false

# Kafka Consumer
spring.kafka.bootstrap-servers = localhost:9092
spring.kafka.consumer.group-id = response-group
spring.kafka.consumer.auto-offset-reset = earliest
spring.kafka.consumer.key-deserializer = org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer = org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages = *
spring.kafka.consumer.properties.spring.json.use.type.headers = false
spring.kafka.consumer.properties.spring.json.value.default.type = com.mailflowai.response.dto.RoutingEvent

# Kafka Producer
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topics
kafka.topic.routing-events = routing-events
kafka.topic.response-events = response-events

# Ollama connections
ollama.api.url = http://localhost:11434/api/generate
ollama.model = llama3.2

