version : '3.8'

services :
    
    # Postgres Configuration
    postgres :
        
        image: postgres:16
        container_name: mailflow-postgres
        
        environment:
            
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            
        ports:
            - "5432:5432"
            
        volumes:
            - postgres_data:/var/lib/postgresql/data
            
        networks:
            - mailflow-network
    
    # Kafka -------------------------------------------------
    
    kafka:
        
        image: apache/kafka:3.9.0
        container_name: mailflow-kafka
        
        environment:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        
        ports:
          - "9092:9092"
        
        networks:
          - mailflow-network

    # ------------------------------------------------------
    
    # Ingestion Service
    ingestion-service:
        
        image: mailflow-ingestion:latest
        container_name: mailflow-ingestion 
        ports:
            - "8081:8081"
            
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            
        depends_on:
            - postgres
            - kafka
            
        networks:
            - mailflow-network
            
    # ------------------------------------------------------        
    # Classification Service
    classification-service:
    
        image: mailflow-classification:latest
        container_name: mailflow-classification
        
        ports:
            - "8082:8082"
        
        environment:
        
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            OLLAMA_API_URL: http://host.docker.internal:11434/api/generate
            
        depends_on:
            - postgres
            - kafka
            
        extra_hosts:
            - "host.docker.internal:host-gateway"
            
        networks:
            - mailflow-network
            
    # ------------------------------------------------------        
    # Routing Service
    routing-service:
        
        image: mailflow-routing:latest
        container_name: mailflow-routing
        
        ports:
            - "8083:8083"
        
        environment:

            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            
        depends_on:
            - postgres
            - kafka
            
        networks:
            - mailflow-network
        
    # ------------------------------------------------------    
    # Response Service
    response-service:
    
        image: mailflow-response:latest
        container_name: mailflow-response
        
        ports:
            - "8084:8084"
        
        environment:
        
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            OLLAMA_API_URL: http://host.docker.internal:11434/api/generate
            
        depends_on:
            - postgres
            - kafka
            
        extra_hosts:
            - "host.docker.internal:host-gateway"
            
        networks:
            - mailflow-network
    
    # -------------------------------------------------------        
    # Notification service
    notification-service:
    
        image: mailflow-notification:latest
        container_name: mailflow-notification
        
        ports:
            - "8085:8085"
        
        environment:

            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            
        depends_on:
            - postgres
            - kafka
            
        networks:
            - mailflow-network
            
# --------------------------------------------------------------
networks:
    mailflow-network:
        driver: bridge        
    
# --------------------------------------------------------------
volumes:
    postgres_data:
    
        
            
            
            
            
        

            
            
            
    
        
    
